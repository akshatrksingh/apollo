<svg width="100%" viewBox="0 0 680 464" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title2 desc2">
<title id="title2">Apollo trial execution flow</title>
<desc id="desc2">One trial: setup seeds the workspace and snapshots state_before, then the agent loop exchanges tool calls and results for up to 20 turns, ending in either a natural stop where the model signals it is done or hitting the max_turns limit. Both paths feed into score, which calls verify and returns 0.0 or 1.0.</desc>
<rect width="680" height="464" fill="#ffffff"/>
<defs>
  <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<line x1="340" y1="76" x2="340" y2="136" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow2)"/>
<line x1="340" y1="192" x2="200" y2="252" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow2)"/>
<line x1="340" y1="192" x2="480" y2="252" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow2)"/>
<line x1="200" y1="308" x2="340" y2="368" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow2)"/>
<line x1="480" y1="308" x2="340" y2="368" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow2)"/>

<g>
  <rect x="180" y="20" width="320" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="39" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#444441">setup()</text>
  <text x="340" y="57" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">seed workspace, snapshot before</text>
</g>

<g>
  <rect x="180" y="136" width="320" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="155" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">agent loop</text>
  <text x="340" y="173" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">tool calls, results, up to 20 turns</text>
</g>

<g>
  <rect x="70" y="252" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="200" y="271" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">natural stop</text>
  <text x="200" y="289" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">model signals it's done</text>
</g>

<g>
  <rect x="350" y="252" width="260" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="480" y="271" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">max_turns</text>
  <text x="480" y="289" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#993C1D">20-turn limit reached</text>
</g>

<g>
  <rect x="180" y="368" width="320" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="387" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#444441">score()</text>
  <text x="340" y="405" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">verify() returns 0.0 or 1.0</text>
</g>
</svg>
