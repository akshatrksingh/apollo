<svg width="100%" viewBox="0 0 680 286" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title1 desc1">
<title id="title1">Apollo architecture and agent isolation</title>
<desc id="desc1">The agent calls 16 Slack and task manager tools that mutate env WorkspaceState during a rollout. harbor score, including verify, ALLOWED_CHANGES, and the state_before snapshot, is read directly by the harness after the rollout and is never exposed to the agent.</desc>
<rect width="680" height="286" fill="#ffffff"/>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<line x1="120" y1="68" x2="150" y2="68" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="350" y1="68" x2="380" y2="68" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="510" y1="96" x2="340" y2="156" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>

<g>
  <rect x="20" y="40" width="100" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="70" y="68" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#444441">Agent</text>
</g>

<g>
  <rect x="150" y="40" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="250" y="59" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">16 tools</text>
  <text x="250" y="77" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">Slack + task manager API</text>
</g>

<g>
  <rect x="380" y="40" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="510" y="59" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">env/ WorkspaceState</text>
  <text x="510" y="77" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">users, channels, messages, tasks</text>
</g>

<g>
  <rect x="180" y="156" width="320" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="340" y="175" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">harbor/ score()</text>
  <text x="340" y="193" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#993C1D">verify(), ALLOWED_CHANGES, state_before</text>
</g>

<text x="340" y="240" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b7270">Teal: mutated via tools during rollout</text>
<text x="340" y="258" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b7270">Coral: read directly by harness after scoring, never exposed to agent</text>
</svg>
